on:
  push:
    branches:
      - main
      - dev
      - staging
    tags:
      - v*

name: Generalized Reproducible Deployments
jobs:
  push:
    name: Invoke General Reproducible Docker Build Pipeline
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
      with:
        role-to-assume: ${{ secrets.GDBP_AWS_IAM_ROLE_ARN }}
        aws-region: us-west-2
    - name: Set REPRODUCIBLE to get a reproducible build
      run: echo "REPRODUCIBLE=true" >> $GITHUB_ENV
    - name: Generalized Deployments
      uses: brave-intl/general-docker-build-pipeline-action@3561407ff0efff530682cba981772eb7435fe5c3 # v1.0.44
